name: signbridge-showcase
region: blr
services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
    dockerfilePath: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs
    routes:
      - path: /
    envs:
      - key: APP_NAME
        value: "SignBridge"
      - key: DEFAULT_PROVIDER
        value: "local_ollama"
      - key: PORT
        value: "8000"
