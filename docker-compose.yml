version: '3.8'

services:
  signbridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signbridge_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=SignBridge
      - DEFAULT_PROVIDER=local_ollama
      - PRIMARY_LLM=gemma4:e4b
      - FALLBACK_LLM=gemma4:e2b
      - PORT=8000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
